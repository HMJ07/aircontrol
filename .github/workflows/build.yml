name: Build installers

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]          # v0.1.0 -> publica los instaladores en la pestaña Releases

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-14      # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt -r requirements-voice.txt pyinstaller
      - name: Pruebas
        run: python -m unittest discover -s tests -v
      - name: Construir .dmg
        run: AIRCONTROL_BUILD_DIR="$RUNNER_TEMP/build" bash packaging/build_mac.sh
      - name: Autotest de la app empaquetada (sin cámara ni permisos)
        run: |
          export AIRCONTROL_DATA_DIR="$RUNNER_TEMP/data"
          "$RUNNER_TEMP/build/dist/AirControl.app/Contents/MacOS/AirControl" --selftest
          tail -20 "$AIRCONTROL_DATA_DIR/aircontrol.log"
          grep -q "SELFTEST OK" "$AIRCONTROL_DATA_DIR/aircontrol.log"
      - uses: actions/upload-artifact@v4
        with: { name: AirControl-macOS, path: dist/AirControl-macOS.dmg }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt -r requirements-voice.txt pyinstaller
      - name: Pruebas
        run: python -m unittest discover -s tests -v
      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Construir instalador
        run: ./packaging/build_windows.ps1
        shell: pwsh
      - name: Autotest de la app empaquetada (sin cámara ni permisos)
        shell: pwsh
        run: |
          $env:AIRCONTROL_DATA_DIR = Join-Path $env:RUNNER_TEMP "data"
          $p = Start-Process -FilePath "dist\AirControl\AirControl.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content (Join-Path $env:AIRCONTROL_DATA_DIR "aircontrol.log") -Tail 20
          if ($p.ExitCode -ne 0) { throw "Autotest fallido (código $($p.ExitCode))" }
      - uses: actions/upload-artifact@v4
        with:
          name: AirControl-Windows
          path: |
            dist/AirControl-Windows.zip
            dist/AirControl-Setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: .github/release-body.md
          generate_release_notes: true
